onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # js-beautify 2.0.3 (latest) pins advisory-affected versions; only its CLI
  # uses these, the browser bundle does not. Drop once js-beautify updates.
  "js-beautify>glob": "^14.0.2"
  "editorconfig>minimatch": "^11.0.1"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
