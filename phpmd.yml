# PHPMD ruleset, see https://phpmd.org/documentation/creating-a-ruleset.html
#
# Tuned for signal: the rules and thresholds here report structural hot spots
# and dead code, not style. Everything the code violated when this was set up
# is accepted in phpmd.baseline.xml, so `composer md` reports only NEW
# violations and is a CI gate. When a hot spot is refactored, run
# `composer md:baseline` to drop it from the baseline.
#
# Left out on purpose:
#   ErrorControlOperator  — `@` is deliberate in T3's file and cache handling
#   BooleanArgumentFlag   — `bool $enabled = true` DI flags are the convention
#   StaticAccess, MissingImport, ElseExpression, Long/ShortVariable, ShortMethodName
# Raised: CyclomaticComplexity 10→20, NPathComplexity 200→2000,
#   ExcessiveClassComplexity 50→100, CouplingBetweenObjects 13→20. The stock
#   thresholds flagged a third of the codebase; these flag the genuine outliers.
name: 'Total CMS'
description: 'Structural hot spots and dead code; style is php-cs-fixer''s job.'
rules:
  - ref: rulesets/cleancode.xml
    exclude: [StaticAccess, MissingImport, ElseExpression, BooleanArgumentFlag, ErrorControlOperator]
  - ref: rulesets/codesize.xml
    exclude: [CyclomaticComplexity, NPathComplexity, ExcessiveClassComplexity]
  - ref: rulesets/codesize.xml/CyclomaticComplexity
    properties: { maximum: 20 }
  - ref: rulesets/codesize.xml/NPathComplexity
    properties: { maximum: 2000 }
  - ref: rulesets/codesize.xml/ExcessiveClassComplexity
    properties: { maximum: 100 }
  - ref: rulesets/design.xml
    exclude: [CouplingBetweenObjects]
  - ref: rulesets/design.xml/CouplingBetweenObjects
    properties: { maximum: 20 }
  - ref: rulesets/controversial.xml
  - ref: rulesets/naming.xml
    exclude: [LongVariable, ShortVariable, ShortMethodName]
  - ref: rulesets/unusedcode.xml
    exclude: [UnusedFormalParameter]
